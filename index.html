<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>濟州島自駕地圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
/* Layout: 一張手繪風的島圖當主角，上方切換日期，下方清單跟著篩選走。刻意只做暖色紙張這一種外觀。 */
:root{
  color-scheme:light;
  --paper:#fbf4e6; --panel:#fffaf0; --sea:#dcece8; --wave:#9cc6c2; --land:#fdf0d2; --hill:#f0deb2;
  --ink:#4b3626; --muted:#7d6753; --line:#dcc9a6;
  --sight:#d8556c; --food:#e2831f; --cafe:#75934a; --stay:#5683ab; --tang:#f2a33a; --leaf:#7d9a4f;
  --font:"Noto Sans TC","Noto Sans KR","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --wob:14px 18px 12px 20px / 18px 12px 20px 14px;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px}
header svg{width:38px;height:38px;flex:none}
h1{font-size:1.7rem;font-weight:700;margin:0;letter-spacing:.04em;line-height:1.25;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:.95rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px dashed var(--ink);outline-offset:2px}

.days{display:flex;flex-wrap:wrap;gap:7px}
.days button{border:1.5px solid var(--line);background:var(--panel);border-radius:var(--wob);padding:4px 13px;font-size:.95rem;font-variant-numeric:tabular-nums}
.days button[aria-pressed="true"]{background:var(--tang);border-color:var(--ink);font-weight:700}

.mapwrap{position:relative;border:2px solid var(--ink);border-radius:var(--wob);overflow:hidden;background:var(--sea)}
#map{display:block;width:100%;aspect-ratio:1000/585;max-width:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.grab{cursor:grabbing}
.landfill{fill:var(--land);stroke:none}
.landline{fill:none;stroke:var(--ink);stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.landline.b{stroke-width:1;opacity:.45}
.decor path,.decor circle{vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.dk{fill:none;stroke:var(--ink);stroke-width:1.4}
.mt{fill:var(--hill);stroke:var(--ink);stroke-width:1.5}
.snow{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
.wv{fill:none;stroke:var(--wave);stroke-width:1.6}
.tg{fill:var(--tang);stroke:var(--ink);stroke-width:1.1}
.lf{fill:var(--leaf);stroke:var(--ink);stroke-width:.9}
.grass{fill:none;stroke:var(--leaf);stroke-width:1.3}
.route{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-dasharray:1 7;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-linejoin:round;opacity:.75}
.rl text{fill:var(--muted);font-size:12.5px;font-family:var(--font);text-anchor:middle;pointer-events:none}
.rl .big text{fill:var(--ink);font-size:12px}

.m{cursor:pointer;outline:none}
.m .hit{fill:transparent}
.sh{fill:var(--ink);opacity:.16}
.bg{fill:var(--c);stroke:var(--panel);stroke-width:1.6}
.bk .bg{fill:var(--panel);stroke:var(--c);stroke-width:1.9}
.ic{fill:none;stroke:var(--panel);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bk .ic{stroke:var(--c)}
.ic .dot{fill:var(--panel);stroke:none}
.bk .ic .dot{fill:var(--c)}
.m .halo{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:3 3;opacity:0}
.m.sel .halo,.m:focus-visible .halo{opacity:1}
.m .ord{display:none;fill:var(--ink);stroke:var(--panel);stroke-width:3.5;paint-order:stroke;font:700 13px var(--font);font-variant-numeric:tabular-nums}
.m.num .ord{display:block}
.m.dim{opacity:.2}
.m.off{display:none}
.c-sight{--c:var(--sight)} .c-food{--c:var(--food)} .c-cafe{--c:var(--cafe)} .c-stay{--c:var(--stay)}

.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:5px}
.zoom button{width:36px;height:36px;border:1.5px solid var(--ink);background:var(--panel);border-radius:var(--wob);font-size:1.05rem;line-height:1}
.zoom button.txt{font-size:.78rem}

#pop{position:absolute;width:min(270px,calc(100% - 16px));background:var(--panel);border:1.8px solid var(--ink);border-radius:var(--wob);
  padding:12px 14px 14px;box-shadow:3px 4px 0 rgba(75,54,38,.18);display:flex;flex-direction:column;gap:3px}
#pop .cat{display:flex;align-items:center;gap:7px;font-size:.85rem;color:var(--muted);padding-right:26px}
#pop h3{margin:2px 0 0;font-size:1.15rem;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
#pop p{margin:0;font-size:.92rem;color:var(--muted)}
#pop .when{color:var(--ink);font-variant-numeric:tabular-nums}
#pop a{margin-top:8px;display:inline-block;text-align:center;background:var(--tang);color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:var(--wob);padding:6px 10px;font-size:.95rem;font-weight:700}
#pop .x{position:absolute;right:6px;top:6px;width:30px;height:30px;border:0;background:none;color:var(--muted);font-size:1.2rem;border-radius:8px}

.legend{display:flex;flex-wrap:wrap;gap:7px 9px;align-items:center}
.legend button{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--panel);border-radius:var(--wob);padding:3px 12px 3px 6px;font-size:.92rem}
.legend button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.legend .key{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);margin-left:4px}
.ico{width:24px;height:24px;flex:none;overflow:visible}

h2{font-size:1.15rem;font-weight:700;margin:6px 0 0}
#list{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:var(--wob);background:var(--panel);overflow:hidden}
.grp{padding:9px 14px 3px;font-size:.85rem;letter-spacing:.06em;color:var(--muted);border-top:1.5px dashed var(--line)}
.grp:first-child{border-top:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch;border-top:1px dashed var(--line)}
.grp + .row{border-top:0}
.row .pick{display:grid;grid-template-columns:44px 24px minmax(0,1fr);gap:9px;align-items:center;text-align:left;border:0;background:none;padding:8px 6px 8px 12px;min-width:0}
.row.sel .pick{background:var(--paper)}
.row .n{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.row .nm{font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.row .zh{display:block;font-size:.88rem;color:var(--muted);font-weight:400}
.row a{display:flex;align-items:center;padding:0 14px;font-size:.9rem;color:var(--ink);text-decoration:underline;text-decoration-style:wavy;text-decoration-color:var(--tang);text-underline-offset:4px;white-space:nowrap}
.note{font-size:.88rem;color:var(--muted);margin:0;max-width:65ch}
</style>
</head>

    </svg>
    <div class="zoom">

      <button type="button" id="zreset" class="txt" aria-label="回到全島">全島</button>
    </div>
    <div id="pop" hidden></div>

</div>

const REGIONS=[['濟州市',126.53,33.535],['西歸浦',126.56,33.285],['城山',126.885,33.415],['中文',126.41,33.285],['翰林',126.275,33.385],['舊左',126.85,33.495],['表善',126.82,33.36],['安德',126.33,33.265],['朝天',126.64,33.505],['南元',126.71,33.315],['牛島',126.985,33.522]];

const places=RAW.map(r=>{const [x,y]=P(r[4],r[5]);return{id:r[0],cat:r[1],name:r[2],zh:r[3],x,y,q:r[6]||r[2],bd:r[7]||null,ic:SPECIAL[r[0]]||DEF[r[1]]};});
const byId=Object.fromEntries(places.map(p=>[p.id,p]));
places.forEach(p=>{p.stops=[];for(const d in ROUTES)ROUTES[d].forEach((id,i)=>{if(id===p.id)p.stops.push({d,o:i+1});});p.backup=p.stops.length===0;});

const badge=ic=>'<circle class="sh" cx="1.2" cy="1.8" r="10"/><circle class="bg" r="10"/><g class="ic">'+ICONS[ic]+'</g>';
const icon=(cat,ic,bk)=>'<svg class="ico c-'+cat+(bk?' bk':'')+'" viewBox="-13 -13 26 26" aria-hidden="true">'+badge(ic)+'</svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const naver=p=>'https://map.naver.com/p/search/'+encodeURIComponent(p.q);

// ---- 手繪海岸線：把曲線取樣後加一點抖動，再描兩次 ----
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function sample(pts,per){const n=pts.length,out=[];for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
  for(let j=0;j<per;j++){const t=j/per,t2=t*t,t3=t2*t;out.push([0,1].map(a=>0.5*((2*p1[a])+(-p0[a]+p2[a])*t+(2*p0[a]-5*p1[a]+4*p2[a]-p3[a])*t2+(-p0[a]+3*p1[a]-3*p2[a]+p3[a])*t3)));}}return out;}
function jitter(pts,amp,seed){const r=rng(seed);return pts.map(p=>[p[0]+(r()-.5)*2*amp,p[1]+(r()-.5)*2*amp]);}
function bez(pts){const n=pts.length;let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    d+='C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);}
  return d+'Z';}
(function(){
  const at=(lon,lat,inner)=>{const [x,y]=P(lon,lat);return '<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+')">'+inner+'</g>';};
  const island=sample(COAST.map(c=>P(c[0],c[1])),3);
  const u=P(126.955,33.506),udo=[];for(let i=0;i<12;i++){const a=i/12*Math.PI*2;udo.push([u[0]+Math.cos(a)*18,u[1]+Math.sin(a)*24]);}
  let land='';
  [[island,7,19],[udo,3,11]].forEach(s=>{const a=bez(jitter(s[0],1.1,s[1])),b=bez(jitter(s[0],2.0,s[2]));
    land+='<path class="landfill" d="'+a+'"/><path class="landline b" d="'+b+'"/><path class="landline" d="'+a+'"/>';});
  $('land').innerHTML=land;

  const wave='<path class="wv" d="M-14 0q3.5-5 7 0t7 0t7 0t7 0"/>';
  const wave2=wave+'<path class="wv" d="M-6 9q3.5-5 7 0t7 0"/>';
  let sea='';[[126.22,33.52],[126.40,33.555],[126.62,33.585],[126.19,33.215],[126.50,33.19],[126.72,33.215],[126.93,33.33],[126.985,33.42],[126.90,33.575],[126.33,33.185]].forEach((c,i)=>{sea+=at(c[0],c[1],i%2?wave:wave2);});
  // 指北針
  sea+='<g transform="translate(62 512)"><circle class="dk" r="17"/><path class="tg" d="M0-22L5 0L0-4L-5 0Z"/><path class="dk" d="M0 22L-5 0L0 4L5 0Z"/><text x="0" y="-27" text-anchor="middle" style="font:700 13px var(--font);fill:var(--ink)">N</text></g>';
  $('sea').innerHTML=sea;

  const mount='<path class="mt" d="M-54 20C-42 7-27-8-17-21C-10-30-2-32 7-21C13-13 17-8 23-6C27-11 31-11 35-4C41 5 47 13 56 20Z"/>'+
    '<path class="snow" d="M-17-21C-10-30-2-32 7-21C3-14-1-18-5-13C-8-18-12-15-17-21Z"/>'+
    '<path class="grass" d="M-34 13l3-5M-27 14l2-6M30 12l3-5M38 15l2-5M-4 6l2-5M4 8l3-5"/>';
  const oreum='<path class="mt" d="M-11 5C-8-6 8-6 11 5Z"/><path class="grass" d="M-3-1l1-4M2 0l2-4"/>';
  const tang='<circle class="tg" r="4.6"/><path class="lf" d="M0-4.4q3-4.6 6.6-2.6q-3 3.4-6.6 2.6z"/>';
  const tree='<path class="dk" d="M0 7V1"/><circle class="lf" cx="0" cy="-3" r="5"/>'+'<g transform="translate(-2.4 -2.2) scale(.42)">'+tang+'</g><g transform="translate(2.4 -4) scale(.42)">'+tang+'</g>';
  let dec=at(126.531,33.362,mount);
  [[126.745,33.415],[126.80,33.43],[126.70,33.44],[126.83,33.40],[126.32,33.345]].forEach(c=>{dec+=at(c[0],c[1],oreum);});
  [[126.60,33.345],[126.655,33.345],[126.47,33.305],[126.35,33.41],[126.73,33.335]].forEach(c=>{dec+=at(c[0],c[1],tree);});
  [[126.24,33.30],[126.41,33.40],[126.61,33.45],[126.87,33.455]].forEach(c=>{dec+=at(c[0],c[1],tang);});
  $('decor').innerHTML=dec;
})();

const scaled=[];
function addScaled(el,x,y){scaled.push({el,x,y});}
REGIONS.forEach(r=>{const [x,y]=P(r[1],r[2]);const g=document.createElementNS(NS,'g');g.innerHTML='<text y="4">'+esc(r[0])+'</text>';$('labels').appendChild(g);addScaled(g,x,y);});
(function(){const [x,y]=P(126.531,33.325);const g=document.createElementNS(NS,'g');g.setAttribute('class','big');g.innerHTML='<text y="4">漢拏山 1,947 m</text>';$('labels').appendChild(g);addScaled(g,x,y);})();

places.forEach(p=>{
  const g=document.createElementNS(NS,'g');
  g.setAttribute('class','m c-'+p.cat+(p.backup?' bk':''));
  g.setAttribute('tabindex','0');g.setAttribute('role','button');
  g.setAttribute('aria-label',CATS[p.cat]+(p.backup?'（備案）':'')+'：'+p.name);
  g.innerHTML='<title>'+esc(p.name)+'</title><circle class="hit" r="16"/><circle class="halo" r="14"/>'+badge(p.ic)+'<text class="ord" x="9" y="-8"></text>';
  g.addEventListener('click',e=>{e.stopPropagation();if(dragged)return;select(p.id);});
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(p.id);}});
  marks.appendChild(g);p.el=g;p.ord=g.querySelector('.ord');addScaled(g,p.x,p.y);
});

// ---- 視圖：縮放與拖曳 ----
const view={k:1,x:0,y:0};
const unit=()=>W/(svg.clientWidth||W);
const clampK=k=>Math.max(1,Math.min(16,k));
function apply(){
  world.setAttribute('transform','translate('+view.x.toFixed(2)+' '+view.y.toFixed(2)+') scale('+view.k.toFixed(4)+')');
  const narrow=(svg.clientWidth||W)<560;
  const s=((narrow?0.8:1)*unit()/view.k).toFixed(4);
  for(const o of scaled)o.el.setAttribute('transform','translate('+o.x.toFixed(1)+' '+o.y.toFixed(1)+') scale('+s+')');
  placePop();
}
function zoomAt(f,px,py){const k2=clampK(view.k*f),r=k2/view.k;view.x=px-(px-view.x)*r;view.y=py-(py-view.y)*r;view.k=k2;apply();}
function fit(list){
  if(!list.length){view.k=1;view.x=0;view.y=0;return apply();}
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;list.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);});
  const pad=70*unit();const k=clampK(Math.min((W-2*pad)/Math.max(x1-x0,1),(H-2*pad)/Math.max(y1-y0,1),7));
  view.k=k;view.x=W/2-(x0+x1)/2*k;view.y=H/2-(y0+y1)/2*k;apply();
}
const ptrs=new Map();let dragged=false,start=null,pinch=null;
function pinchNow(){const a=[...ptrs.values()],r=svg.getBoundingClientRect(),u=unit();
  return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,cx:((a[0].x+a[1].x)/2-r.left)*u,cy:((a[0].y+a[1].y)/2-r.top)*u};}
svg.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});dragged=false;
  if(ptrs.size===1){start={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};pinch=null;}
  else if(ptrs.size===2){const p=pinchNow();pinch={d:p.d,k:view.k,wx:(p.cx-view.x)/view.k,wy:(p.cy-view.y)/view.k};start=null;}
});
window.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1&&start){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>5){dragged=true;svg.classList.add('grab');}
    if(dragged){const u=unit();view.x=start.vx+dx*u;view.y=start.vy+dy*u;apply();}}
  else if(ptrs.size===2&&pinch){const p=pinchNow();dragged=true;view.k=clampK(pinch.k*p.d/pinch.d);view.x=p.cx-pinch.wx*view.k;view.y=p.cy-pinch.wy*view.k;apply();}
});
function up(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);pinch=null;svg.classList.remove('grab');
  if(ptrs.size===1){const a=[...ptrs.values()][0];start={x:a.x,y:a.y,vx:view.x,vy:view.y};}else start=null;}
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),u=unit();zoomAt(e.deltaY<0?1.25:0.8,(e.clientX-r.left)*u,(e.clientY-r.top)*u);},{passive:false});
svg.addEventListener('click',()=>{if(!dragged)select(null);});
$('zin').addEventListener('click',()=>zoomAt(1.5,W/2,H/2));
$('zout').addEventListener('click',()=>zoomAt(1/1.5,W/2,H/2));
$('zreset').addEventListener('click',()=>{view.k=1;view.x=0;view.y=0;apply();});
window.addEventListener('resize',apply);

// ---- 篩選與選取 ----
let day=null,sel=null;const cats=new Set(Object.keys(CATS));
const inDay=p=>day===null||p.stops.some(s=>s.d===day)||p.bd===day;
const shown=p=>cats.has(p.cat);

function whenText(p){
  if(p.backup)return '備案'+(p.bd?'・'+p.bd+' 順路':'');
  return p.stops.map(s=>s.d+' 第 '+s.o+' 站').join('、');
}
function placePop(){
  if(!sel||pop.hidden)return;const p=byId[sel],u=unit();
  const px=(p.x*view.k+view.x)/u,py=(p.y*view.k+view.y)/u,w=pop.offsetWidth,h=pop.offsetHeight,Wd=wrap.clientWidth,Hd=wrap.clientHeight;
  let left=Math.max(8,Math.min(Wd-w-8,px-w/2)),top=py-h-20;
  if(top<8)top=py+20;if(top+h>Hd-8)top=Math.max(8,Hd-h-8);
  pop.style.left=left+'px';pop.style.top=top+'px';
}
function select(id){
  sel=id;
  places.forEach(p=>p.el.classList.toggle('sel',p.id===id));
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel',r.dataset.id===id));
  if(!id){pop.hidden=true;return;}
  const p=byId[id];marks.appendChild(p.el);
  pop.innerHTML='<button type="button" class="x" aria-label="關閉">×</button>'+
    '<div class="cat">'+icon(p.cat,p.ic,p.backup)+esc(CATS[p.cat])+(p.backup?'・備案':'')+'</div>'+
    '<h3>'+esc(p.name)+'</h3><p>'+esc(p.zh)+'</p><p class="when">'+esc(whenText(p))+'</p>'+
    '<a href="'+naver(p)+'" target="_blank" rel="noopener">在 Naver 地圖開啟 ↗</a>';
  pop.querySelector('.x').addEventListener('click',()=>select(null));
  pop.hidden=false;placePop();
}
function focusOn(id){
  const p=byId[id],u=unit();
  const px=p.x*view.k+view.x,py=p.y*view.k+view.y;
  if(view.k<3||px<60*u||px>W-60*u||py<60*u||py>H-60*u){view.k=Math.max(view.k,4);view.x=W/2-p.x*view.k;view.y=H*0.62-p.y*view.k;apply();}
  select(id);wrap.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function renderList(){
  const list=$('list');let html='';
  const row=(p,n)=>'<div class="row" data-id="'+p.id+'"><button type="button" class="pick"><span class="n">'+esc(n)+'</span>'+icon(p.cat,p.ic,p.backup)+
    '<span class="nm">'+esc(p.name)+'<span class="zh">'+esc(p.zh)+'</span></span></button><a href="'+naver(p)+'" target="_blank" rel="noopener">Naver ↗</a></div>';
  if(day){
    const main=ROUTES[day].map(id=>byId[id]).filter(shown),bk=places.filter(p=>p.bd===day&&shown(p));
    if(main.length){html+='<div class="grp">主線・依順序</div>';main.forEach(p=>{html+=row(p,ROUTES[day].indexOf(p.id)+1);});}
    if(bk.length){html+='<div class="grp">備案・順路可停</div>';bk.forEach(p=>{html+=row(p,'');});}
    $('listTitle').textContent=day+' 的地點';
  }else{
    Object.keys(CATS).forEach(c=>{if(!cats.has(c))return;const ps=places.filter(p=>p.cat===c);if(!ps.length)return;
      html+='<div class="grp">'+CATS[c]+'・'+ps.length+' 個</div>';
      ps.forEach(p=>{html+=row(p,p.backup?'備':p.stops[0].d);});});
    $('listTitle').textContent='全部地點';
  }
  list.innerHTML=html||'<div class="grp">沒有符合的地點，請把上面的類型打開。</div>';
  list.querySelectorAll('.row').forEach(r=>{r.classList.toggle('sel',r.dataset.id===sel);r.querySelector('.pick').addEventListener('click',()=>focusOn(r.dataset.id));});
}
function refresh(doFit){
  places.forEach(p=>{
    p.el.classList.toggle('off',!shown(p));
    p.el.classList.toggle('dim',!inDay(p));
    const s=day&&p.stops.find(s=>s.d===day);
    p.el.classList.toggle('num',!!s);p.ord.textContent=s?s.o:'';
  });
  // 疊放順序：淡化的在下，備案其次，主線最上
  places.filter(p=>!inDay(p)).concat(places.filter(p=>inDay(p)&&p.backup),places.filter(p=>inDay(p)&&!p.backup)).forEach(p=>marks.appendChild(p.el));
  $('route').setAttribute('d',day?ROUTES[day].map((id,i)=>(i?'L':'M')+byId[id].x.toFixed(1)+' '+byId[id].y.toFixed(1)).join(''):'');
  if(sel&&(!shown(byId[sel])||!inDay(byId[sel])))select(null);
  renderList();
  if(doFit)fit(day?places.filter(p=>inDay(p)&&shown(p)):[]);
}

// 日期切換
(function(){
  const box=$('days');const mk=(label,val)=>{const b=document.createElement('button');b.type='button';b.id='day-'+(val?val.replace(/\D/g,''):'all');b.textContent=label;b.setAttribute('aria-pressed',String(day===val));
    b.addEventListener('click',()=>{day=val;box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');refresh(true);});box.appendChild(b);};
  mk('全部',null);DAYS.forEach(d=>mk(d[0]+'（'+d[1]+'）',d[0]));
})();
// 圖例（可切換類型）
(function(){
  const box=$('legend');
  Object.keys(CATS).forEach(c=>{const b=document.createElement('button');b.type='button';b.id='cat-'+c;b.setAttribute('aria-pressed','true');b.innerHTML=icon(c,DEF[c],false)+esc(CATS[c]);
    b.addEventListener('click',()=>{if(cats.has(c))cats.delete(c);else cats.add(c);b.setAttribute('aria-pressed',String(cats.has(c)));refresh(false);});box.appendChild(b);});
  const k=document.createElement('span');k.className='key';k.innerHTML=icon('cafe','cup',false)+'實心＝主線'+'&nbsp;&nbsp;'+icon('cafe','cup',true)+'空心＝備案';box.appendChild(k);
  const k2=document.createElement('span');k2.className='key';k2.innerHTML=icon('sight','flower',false)+'山茶花&nbsp;&nbsp;'+icon('cafe','bread',false)+'麵包店&nbsp;&nbsp;'+icon('sight','plane',false)+'機場';box.appendChild(k2);
})();

refresh(false);apply();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placePop);
})();
</script>
